# Render blueprint for the FastAPI backend (https://render.com).
# Railway works the same way — point it at backend/Dockerfile and set the same env.
# The Next.js frontend deploys separately on Vercel (see README).
services:
  - type: web
    name: balkan-fleet-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # ── Database: Turso / libSQL (chosen) ──────────────────────────────────
      # From `turso db show <db> --url`  (libsql://<db>-<org>.turso.io)
      #  and  `turso db tokens create <db>`.  Tables auto-create on first boot.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # ── OR Postgres (Neon) instead — set this, leave TURSO_* blank ──────────
      - key: DATABASE_URL
        sync: false
      # Long random secret for signing session JWTs. Required.
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated allowed frontend origins, e.g. https://balkan-fleet.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Cross-site cookie needs Secure + SameSite=None (frontend ≠ API origin).
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
